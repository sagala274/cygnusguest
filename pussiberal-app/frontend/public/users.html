<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Pengguna - PUSSIBERAL Guest Management</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-mark" src="assets/logo.png" alt="PUSSIBERAL">
      <div>
        <div class="brand-name">PUSSIBERAL</div>
        <div class="brand-subtitle">GUEST MANAGEMENT</div>
      </div>
    </div>
    <nav class="nav" id="mainNav"></nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-title">Manajemen Pengguna</div>
      <div class="top-right">
        <div class="profile-menu" id="profileMenu">
          <button type="button" class="profile" id="profileTrigger">
            <div class="profile-text">
              <div class="profile-name" id="profileName"></div>
              <div class="profile-role" id="profileRole"></div>
            </div>
            <div class="avatar"></div>
          </button>
          <div class="profile-dropdown" id="profileDropdown">
            <a href="#" id="logoutBtn" class="profile-dropdown-item"><span class="nav-icon">⎋</span><span>Logout</span></a>
          </div>
        </div>
      </div>
    </header>

    <section class="content" style="max-width: 1120px;">
      <div class="page-header-row">
        <div class="page-header-text">
          <h1 class="page-title">Manajemen Pengguna</h1>
          <p class="page-description">Kelola akun Administrator, Verifikator, dan Petugas Pos Depan.</p>
        </div>
        <button type="button" class="btn btn-accent" id="addUserBtn">+ Tambah Pengguna</button>
      </div>

      <div id="resultBox" class="result-box" style="display:none;"></div>

      <div class="table-toolbar">
        <div class="search-input-wrap">
          <span class="icon-slot" id="searchIconSlot"></span>
          <input type="text" id="searchInput" placeholder="Cari username, nama, atau role...">
        </div>
        <div class="select-filter-wrap">
          <span class="icon-slot" id="roleIconSlot"></span>
          <select id="roleFilter">
            <option value="">Semua Role</option>
            <option value="admin">Administrator</option>
            <option value="verifikator">Verifikator</option>
            <option value="pos_depan">Petugas Pos Depan</option>
          </select>
        </div>
        <div class="select-filter-wrap">
          <span class="icon-slot" id="statusIconSlot"></span>
          <select id="statusFilter">
            <option value="">Semua Status</option>
            <option value="1">Aktif</option>
            <option value="0">Nonaktif</option>
          </select>
        </div>
      </div>

      <div class="form-card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th><button type="button" class="th-sort-btn" data-sort="username">Username <span class="sort-icon-slot"></span></button></th>
                <th><button type="button" class="th-sort-btn" data-sort="full_name">Nama Lengkap <span class="sort-icon-slot"></span></button></th>
                <th><button type="button" class="th-sort-btn" data-sort="role">Role <span class="sort-icon-slot"></span></button></th>
                <th><button type="button" class="th-sort-btn" data-sort="is_active">Status <span class="sort-icon-slot"></span></button></th>
                <th></th>
              </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
          </table>
        </div>
        <div class="pagination-bar" id="paginationBar"></div>
      </div>
    </section>
  </main>
</div>

<div class="modal-overlay" id="userModal">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modalTitle">Tambah Pengguna Baru</h2>
      <button type="button" class="modal-close" id="modalCloseBtn"><span class="icon-slot" id="closeIconSlot"></span></button>
    </div>
    <div class="modal-body">
      <form id="userForm" class="grid">
        <div class="field full" id="usernameField">
          <label for="formUsername">USERNAME <span class="required">*</span></label>
          <input id="formUsername" required>
        </div>
        <div class="field full">
          <label for="formFullName">NAMA LENGKAP <span class="required">*</span></label>
          <input id="formFullName" required>
        </div>
        <div class="field full">
          <label for="formPassword" id="passwordLabel">PASSWORD <span class="required">*</span></label>
          <input id="formPassword" type="password" minlength="8">
        </div>
        <div class="field full">
          <label for="formRole">ROLE <span class="required">*</span></label>
          <select id="formRole" required>
            <option value="pos_depan">Petugas Pos Depan</option>
            <option value="verifikator">Verifikator</option>
            <option value="admin">Administrator</option>
          </select>
        </div>
        <div class="full modal-actions">
          <button type="button" class="btn" id="modalCancelBtn">Batal</button>
          <button type="submit" class="btn btn-accent" id="modalSubmitBtn">Tambah Pengguna</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script src="assets/users.js"></script>
</body>
</html>
