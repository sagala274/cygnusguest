<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - PUSSIBERAL Guest Management</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-mark" src="assets/logo.png" alt="PUSSIBERAL">
      <div>
        <div class="brand-name">PUSSIBERAL</div>
        <div class="brand-subtitle">GUEST MANAGEMENT</div>
      </div>
    </div>
    <nav class="nav" id="mainNav"></nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-title">Dashboard</div>
      <div class="top-right">
        <div class="profile-menu" id="profileMenu">
          <button type="button" class="profile" id="profileTrigger">
            <div class="profile-text">
              <div class="profile-name" id="profileName"></div>
              <div class="profile-role" id="profileRole"></div>
            </div>
            <div class="avatar"></div>
          </button>
          <div class="profile-dropdown" id="profileDropdown">
            <a href="#" id="logoutBtn" class="profile-dropdown-item"><span class="nav-icon">⎋</span><span>Logout</span></a>
          </div>
        </div>
      </div>
    </header>

    <section class="content" style="max-width: 1180px;">
      <div class="page-header-row">
        <div class="page-header-text">
          <h1 class="page-title"><span id="welcomeTitle">Selamat datang!</span></h1>
          <p class="page-description" id="welcomeDesc">Berikut ringkasan aktivitas pendaftaran dan kunjungan tamu PUSSIBERAL.</p>
        </div>
        <button type="button" class="btn date-badge-btn" id="dateBadgeBtn" title="Filter tanggal (segera hadir)">
          <span class="icon-slot" id="calendarIconSlot"></span>
          <span id="todayLabel"></span>
          <span class="icon-slot" id="dateChevronSlot"></span>
        </button>
      </div>

      <div class="stat-grid" id="statGrid"></div>

      <div class="dashboard-row" id="dashboardMidRow"></div>

      <div class="dashboard-row dashboard-row-bottom" id="dashboardBottomRow">
        <div class="form-card" style="display:none;" id="visitChartCard">
          <div class="section">
            <div class="section-header-row">
              <h2 class="section-title">Grafik Kunjungan Tamu ke Mabesal</h2>
              <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <div class="chart-period-toggle">
                  <button type="button" class="btn btn-small chart-period-btn" data-period="day">Per Hari</button>
                  <button type="button" class="btn btn-small chart-period-btn is-active" data-period="week">Per Minggu</button>
                  <button type="button" class="btn btn-small chart-period-btn" data-period="month">Per Bulan</button>
                </div>
                <button type="button" class="btn btn-small" id="toggleChartView">Lihat sebagai Tabel</button>
              </div>
            </div>
            <p class="page-description" style="margin-bottom:16px;">Jumlah tamu yang terdaftar per periode. Khusus terlihat oleh Administrator.</p>

            <div class="bar-chart-wrap" id="visitChart"></div>
            <div id="visitChartTable" style="display:none;"></div>
          </div>
        </div>

        <div class="form-card" style="display:none;" id="activityCard">
          <div class="section">
            <h2 class="section-title">Aktivitas Terbaru</h2>
            <div id="activityList"></div>
            <a class="link dashboard-card-link" href="audit-log">Lihat semua aktivitas &rarr;</a>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="assets/app.js"></script>
<script src="assets/dashboard.js"></script>
</body>
</html>
