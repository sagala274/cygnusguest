<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan - PUSSIBERAL Guest Management</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div>
        <div class="brand-name">PUSSIBERAL</div>
        <div class="brand-subtitle">GUEST MANAGEMENT</div>
      </div>
    </div>
    <nav class="nav" id="mainNav"></nav>
    <div class="logout">
      <a class="nav-item" href="#" id="logoutBtn"><span class="nav-icon">⎋</span><span>Logout</span></a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-title">Laporan</div>
      <div class="top-right">
        <div class="profile">
          <div class="profile-text">
            <div class="profile-name" id="profileName"></div>
            <div class="profile-role" id="profileRole"></div>
          </div>
          <div class="avatar"></div>
        </div>
      </div>
    </header>

    <section class="content" style="max-width: 1120px;">
      <h1 class="page-title">Rekap Kunjungan</h1>
      <p class="page-description">Rekap kunjungan tamu berdasarkan periode pendaftaran.</p>

      <div class="toolbar">
        <label style="display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700;">Dari
          <input id="fromDate" type="date">
        </label>
        <label style="display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700;">Sampai
          <input id="toDate" type="date">
        </label>
        <button class="btn" id="filterBtn">Tampilkan</button>
        <button class="btn" id="exportXlsxBtn">Unduh Excel</button>
        <button class="btn" id="exportPdfBtn">Unduh PDF</button>
      </div>

      <div id="resultBox" class="result-box" style="display:none;"></div>

      <div class="form-card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>No. Registrasi</th>
                <th>Perusahaan</th>
                <th>Jml</th>
                <th>Nama Tamu</th>
                <th>Status</th>
                <th>Check-in</th>
                <th>Check-out</th>
              </tr>
            </thead>
            <tbody id="reportTableBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="assets/app.js"></script>
<script src="assets/laporan.js"></script>
</body>
</html>
