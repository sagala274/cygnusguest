<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Tamu - PUSSIBERAL Guest Management</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-mark" src="assets/logo.png" alt="PUSSIBERAL">
      <div>
        <div class="brand-name">PUSSIBERAL</div>
        <div class="brand-subtitle">GUEST MANAGEMENT</div>
      </div>
    </div>
    <nav class="nav" id="mainNav"></nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-title">Detail Tamu</div>
      <div class="top-right">
        <div class="profile-menu" id="profileMenu">
          <button type="button" class="profile" id="profileTrigger">
            <div class="profile-text">
              <div class="profile-name" id="profileName"></div>
              <div class="profile-role" id="profileRole"></div>
            </div>
            <div class="avatar"></div>
          </button>
          <div class="profile-dropdown" id="profileDropdown">
            <a href="#" id="logoutBtn" class="profile-dropdown-item"><span class="nav-icon">⎋</span><span>Logout</span></a>
          </div>
        </div>
      </div>
    </header>

    <section class="content">
      <p><a class="link" href="daftar-tamu">&larr; Kembali ke Daftar Tamu</a></p>
      <h1 class="page-title" id="guestName">Memuat...</h1>
      <p class="page-description" id="regNumber"></p>

      <div id="resultBox" class="result-box" style="display:none;"></div>

      <div class="form-card">
        <div class="section">
          <h2 class="section-title">Detail Pendaftaran</h2>
          <div id="detailRows"></div>
        </div>

        <div class="section">
          <h2 class="section-title">Daftar Tamu</h2>
          <div id="membersList"></div>
        </div>

        <div class="section" id="verifySection" style="display:none;">
          <h2 class="section-title">Verifikasi Pendaftaran</h2>
          <p class="page-description" style="margin-bottom:16px;">Periksa kelengkapan dan kelayakan data tamu sebelum menyetujui kunjungan.</p>
          <div class="inline-form">
            <button class="btn btn-primary" id="approveBtn">✔ Setujui</button>
            <button class="btn btn-danger" id="rejectBtn">✕ Tolak</button>
          </div>
        </div>

        <div class="actions" id="visitActions"></div>
      </div>
    </section>
  </main>
</div>

<script src="assets/app.js"></script>
<script src="assets/detail-tamu.js"></script>
</body>
</html>
