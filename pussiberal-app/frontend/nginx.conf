server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=7776000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Tanpa ini, browser boleh menyimpan HTML/JS/CSS lama tanpa validasi ulang
    # (heuristic caching) -- menu/fitur baru bisa "hilang" di sisi pengguna
    # walau server sudah ter-update. no-cache tetap mengizinkan caching tapi
    # mewajibkan validasi (conditional GET) di tiap request -- berlaku juga
    # untuk /api/* agar respons API tidak pernah tersimpan cache browser.
    add_header Cache-Control "no-cache" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        # "backend" SENGAJA di-resolve lewat variabel + resolver Docker
        # (127.0.0.11), bukan ditulis langsung di proxy_pass -- nginx hanya
        # me-resolve hostname polos SEKALI saat startup dan menyimpan IP-nya
        # selamanya (tidak otomatis mengikuti kalau container backend
        # di-restart/rebuild dan dapat IP baru). Tanpa ini, setiap deploy
        # backend-saja (tanpa ikut me-restart frontend) berisiko bikin nginx
        # "nyasar" ke IP lama -> seluruh /api/* mendadak 502 Bad Gateway
        # walau backend-nya sendiri sehat. Variabel memaksa nginx me-resolve
        # ulang tiap kali TTL (valid=10s) habis.
        # PENTING: proxy_pass di sini SENGAJA tidak diberi URI ("/api/")
        # sama sekali -- begitu proxy_pass memakai variabel, nginx MEMATIKAN
        # penggantian prefix location otomatis dan meneruskan URI request
        # ASLI apa adanya. Kalau tetap ditambahkan "/api/" di sini, hasilnya
        # URI dobel ("/api/api/...") dan backend membalas 404 untuk semua
        # permintaan -- sudah pernah kejadian, jangan diulang.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI Chat (menganalisa data via Claude API) bisa memakan waktu lebih lama
        # dari default 60s, terutama saat model melakukan reasoning lebih panjang.
        proxy_read_timeout 180s;
    }

    # Sembunyikan ekstensi .html dari URL -- akses langsung ke *.html tetap
    # bekerja tapi di-redirect permanen ke versi tanpa ekstensi, supaya URL
    # yang sudah pernah dibagikan/dibookmark juga ikut rapi.
    location ~ ^/(.+)\.html$ {
        return 301 /$1$is_args$args;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
