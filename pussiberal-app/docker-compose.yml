name: pussiberal

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [pussiberal]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PORT: 3000
      BACKUP_DIR: /app/backups
    volumes:
      - ./backups:/app/backups
    depends_on:
      mysql:
        condition: service_healthy
    networks: [pussiberal]

  # AI Lokal (Ollama) -- dijalankan sebagai container, bukan langsung di
  # host, supaya seluruh deployment cukup lewat "docker compose" tanpa ada
  # layanan lain yang perlu dikelola terpisah (systemd, dst). SENGAJA tidak
  # ada "ports:" di sini -- tidak dipetakan ke host sama sekali, hanya bisa
  # dijangkau container lain di jaringan "pussiberal" yang sama (mis.
  # backend lewat http://ollama:11434) -- lebih tertutup daripada
  # pendekatan sebelumnya (host + firewall iptables manual).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks: [pussiberal]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks: [pussiberal]

networks:
  pussiberal:

volumes:
  mysql_data:
  ollama_data:
